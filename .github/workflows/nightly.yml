name: Nightly E2E

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  TERASLAB_FULL_WORKLOAD: "1"

jobs:
  full-e2e:
    name: Full-volume E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Full workload tests
        run: cargo test --test e2e_workload --test stress_tests -- --nocapture

      - name: Slow lib tests (slow-tests feature)
        # Gated behind the `slow-tests` cargo feature so PR runs stay fast.
        # Currently covers three hashtable benchmarks-as-tests in
        # src/index/hashtable.rs: ten_million_entries (~508s debug),
        # bench_lookup_1m and bench_insert_throughput (~6s each debug).
        run: cargo test --features slow-tests --lib

      - name: Criterion benchmarks
        run: cargo bench -- --output-format bencher | tee bench-output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench-output.txt
            target/criterion/

  fuzz:
    name: Wire-protocol fuzz (time-boxed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # libFuzzer instrumentation requires nightly Rust. Pinned to a specific
      # dated nightly instead of floating `nightly`: nightly-2026-07-24 and
      # nightly-2026-07-25 (rustc commits 89c61a754 / da86f4d07) both ICE
      # compiling tokio under the ASAN/SanitizerCoverage flags below —
      # "not immediate: OperandRef(Uninit @ ... UnsafeCell<MaybeUninit<
      # runtime::task::Notified<Arc<multi_thread::handle::Handle>>>>)" at
      # rustc_codegen_ssa/src/mir/operand.rs:291:18. Reproduced locally on
      # aarch64-apple-darwin with nightly-2026-07-24, byte-identical panic to
      # the CI failures (nightly runs 30065645495, 30143215764) — a genuine
      # rustc regression, not our code. nightly-2026-07-23 (commit 6f72b5dd5)
      # is the last nightly confirmed clean, both in CI (run 29978434737) and
      # locally. Bumping this pin requires re-verifying the fuzz target still
      # builds (`cargo +nightly-<date> fuzz build decode_request`) before
      # moving the date forward.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-23

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz

      - name: Fuzz decode_request (5 min cap)
        # Coverage-guided exploration of the untrusted wire decoders. The
        # deterministic half (tests/wire_fuzz_smoke.rs) runs on every PR;
        # this is the time-boxed coverage-guided complement. A crash/timeout
        # input fails the job and leaves a repro under fuzz/artifacts/.
        # The fuzz crate is detached from the workspace, so it builds with
        # the nightly toolchain here; `+nightly-2026-07-23` must match the
        # dated pin above — a bare `+nightly` would silently float onto the
        # broken compiler again next time GitHub's `nightly` moves forward.
        #
        # The grep guard below is load-bearing: a build failure alone already
        # fails this step (and did, on the ICE above) but a future change
        # that makes cargo-fuzz exit 0 without ever invoking libFuzzer
        # (e.g. a flag typo) would go unnoticed by that alone. Requiring at
        # least one `exec/s:` status line proves the fuzzer actually ran.
        # Relies on GitHub Actions' default `bash -eo pipefail` so a failure
        # in `cargo fuzz run` fails the pipeline before the grep runs.
        run: |
          cargo +nightly-2026-07-23 fuzz run decode_request -- -max_total_time=300 -timeout=10 2>&1 | tee fuzz-run.log
          grep -q 'exec/s:' fuzz-run.log || { echo "::error::no libFuzzer stats ('exec/s:') in output — the fuzzer likely never ran"; exit 1; }

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  docker-e2e:
    name: Docker cluster E2E (nightly tier)
    runs-on: ubuntu-latest
    # The nightly tier now includes scenarios 14 (Split-Brain Prevention) and
    # 15 (Crash Recovery) — the cardinal no-double-spend durability gates that
    # were previously weekly-only. Their per-scenario timeout caps in
    # run_all.sh add ~37 min worst-case on top of the rest of the nightly set,
    # so the job timeout is raised from 90 to 150 min. Real runs finish well
    # under this; the cap only guards a slow-but-progressing run from CI kill.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Docker image
        run: docker build -t teraslab:test -f teraslab-tests/docker/Dockerfile .

      - name: Build test client
        working-directory: teraslab-tests/client
        run: cargo build --release

      - name: Run nightly scenarios
        working-directory: teraslab-tests
        run: ./run_all.sh --tier nightly

      - name: Collect logs on failure
        if: failure()
        working-directory: teraslab-tests
        run: |
          mkdir -p ci-logs
          for dir in results/*/; do
            cp -r "$dir" ci-logs/ 2>/dev/null || true
          done

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-logs
          path: teraslab-tests/ci-logs/
          if-no-files-found: ignore
