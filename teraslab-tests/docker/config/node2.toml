node_id = 2
listen_addr = "172.30.0.12:3300"
http_listen_addr = "0.0.0.0:9100"
swim_port = 3301
seed_nodes = ["172.30.0.11:3301", "172.30.0.13:3301"]
replication_factor = 2
swim_probe_interval_ms = 150
swim_suspicion_timeout_ms = 1000
device_paths = ["/data/teraslab.dat"]
device_size = 2147483648
device_alignment = 4096
redo_log_size = 268435456
index_snapshot_path = "/data/index.snap"
expected_records = 1000000
lock_stripes = 65536
max_batch_size = 8192
max_connections = 1024
# E2E overlay only — do NOT copy to production (src/config.rs default stays 64).
# Every harness connection (client pools, scenario pollers, bench workers) enters
# the compose network through the single Docker gateway IP, so the per-IP cap
# aggregates ALL harness traffic onto one address; the production default (64)
# starves it ("per-IP cap reached count=64 limit=64" -> accept-then-close seen
# as "connection closed"). Same family as migration_pool_size(128) > cap(64).
max_connections_per_ip = 256
block_height_retention = 288

# test cluster only — production must use mTLS / non-default secret
cluster_secret = "docker-test-cluster-shared-secret-do-not-use-in-prod"
enable_remote_bind = true
enable_admin_endpoints = true

# F-E2: shared cluster_id for every node of THIS test cluster (32 hex = 16 bytes).
# Required under the default strict_auth so the cross-cluster merge guard is armed.
cluster_id = "ababababababababababababababab01"
